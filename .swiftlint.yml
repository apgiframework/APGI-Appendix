# SwiftLint Configuration
# https://github.com/realm/SwiftLint

excluded:
  - Carthage
  - Pods
  - DerivedData
  - build
  - .build
  - "*.generated.swift"

# Opt-in rules
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs
  - redundant_nil_coalescing
  - redundant_type_annotation
  - private_outlet
  - prohibited_super_call
  - nimble_operator
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - line_length
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - type_name
  - cyclomatic_complexity

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: 'print\('
    message: "Prefer using logging framework instead of print()"
    severity: warning

# Reporter configuration
reporter: "xcode"
